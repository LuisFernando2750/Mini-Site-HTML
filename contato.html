<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mini Site | Elden Ring </title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="./img/favicon-32x32.png">
</head>

<body>

    <header>
        <h1>Elden Ring</h1>
        <img src="img/er.png" alt="Imagem que é a base para a capa do jogo Elden Ring da FromSoftware" width="500"
            height="300">
        <h2><strong>A Lenda das Terras Intermédias</strong></h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <hr>
    <main>
        
        <form>
          <fieldset>
            <legend>Formulário de Contato</legend>
            <label for="name">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Luís Fernando" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@email.com" required>
            <br><br>
            <label for="subject">Assunto:</label>
            <input type="text" id="subject" name="subject" placeholder="Escreva o assunto aqui..." required><br>
            <select id="subject" name="subject" required>
              <option value="">Selecione uma categoria</option>
              <option value="feedback">Feedback</option>
              <option value="general">Geral</option>
              <option value="collaboration">Sugestões</option>
              <option value="other">Outro</option>
            </select>
            <br><br>
            <label for="message">Mensagem:</label> <br>
            <textarea id="message" name="message" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
            <br><br>
            <label>
            <input type="checkbox" name="checkbox" id="checkbox" required>Eu concordo com os termos e condições
            </label><br><br>
            <button>Enviar formulário</button>
          </fieldset>
        </form>

    </main>







    <hr>

    <footer>
        <p>Desenvolvido por: Luís Fernando Marcello Tortosa</p>
        <p id="">2026..&copy; Todos os direitos reservados</p>
        <br>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" id="surpresa">Pequena
            surpresa</a>
    </footer>

</body>

</html>
